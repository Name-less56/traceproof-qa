<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">TraceProof QA</title>
  <desc id="desc">Cyberpunk product banner: chamfered TraceProof mark, neon globe with city beacon and hub arcs.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#05060b"/><stop offset=".55" stop-color="#080b14"/><stop offset="1" stop-color="#140a1e"/></linearGradient>
    <linearGradient id="neon" x2="1"><stop stop-color="#3dffd0"/><stop offset=".5" stop-color="#4db8ff"/><stop offset="1" stop-color="#9b7bff"/></linearGradient>
    <linearGradient id="hot" x2="1"><stop stop-color="#ff3d9a"/><stop offset="1" stop-color="#9b7bff"/></linearGradient>
    <radialGradient id="atmo" cx=".5" cy=".5" r=".5"><stop offset=".72" stop-color="#3dffd0" stop-opacity="0"/><stop offset=".9" stop-color="#3dffd0" stop-opacity=".28"/><stop offset="1" stop-color="#9b7bff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#3dffd0" fill-opacity=".55"/></pattern>
    <clipPath id="globe"><circle cx="945" cy="180" r="128"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path d="M0 0h1166l34 34v326H34L0 326z" fill="url(#bg)"/>
  <path d="M0 0h1166l34 34v326H34L0 326z" fill="url(#grid)"/>
  <path d="M.5.5h1165.3l33.7 33.7V359.5H34.2L.5 325.8z" fill="none" stroke="#323c55"/>
  <path d="M24 24h34M24 24v34" stroke="#3dffd0" stroke-width="2"/>
  <path d="M1176 336h-34M1176 336v-34" stroke="#ff3d9a" stroke-width="2"/>

  <!-- globe -->
  <circle cx="945" cy="180" r="150" fill="url(#atmo)"/>
  <g clip-path="url(#globe)">
    <circle cx="945" cy="180" r="128" fill="#060a14"/>
    <path d="M860 92c22-10 50-8 66 6 12 10 10 26 24 34 18 10 38 2 44 20 6 20-18 30-20 50-2 22 22 40 10 62-10 18-36 18-50 34-10 12-8 34-24 38-22 6-30-24-34-44-4-22-22-34-24-56-2-20 16-34 8-52-6-14-30-14-34-30-4-14 12-26 34-30z" fill="url(#dots)"/>
    <path d="M1005 70c18 6 30 22 44 30 14 8 30 6 34 22 4 18-14 26-22 40-6 12 2 30-12 36-16 6-26-14-42-12-14 2-22 18-36 14-12-4-10-22-18-30-10-10-28-8-30-22-2-16 18-20 24-34 6-14 2-32 16-40 14-8 28-8 42-4z" fill="url(#dots)" opacity=".75"/>
    <ellipse cx="945" cy="180" rx="128" ry="34" fill="none" stroke="#4d6cff" stroke-opacity=".25"/>
    <ellipse cx="945" cy="180" rx="46" ry="128" fill="none" stroke="#4d6cff" stroke-opacity=".25"/>
    <path d="M817 180h256" stroke="#4d6cff" stroke-opacity=".25"/>
  </g>
  <circle cx="945" cy="180" r="128" fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="945" cy="180" r="142" fill="none" stroke="#ff3d9a" stroke-opacity=".35" stroke-dasharray="3 9"/>
  <!-- hub arcs -->
  <path d="M902 214C910 150 930 110 960 96" fill="none" stroke="url(#hot)" stroke-width="2" filter="url(#glow)"/>
  <path d="M902 214C950 170 1000 130 1040 118" fill="none" stroke="url(#hot)" stroke-width="2" opacity=".8" filter="url(#glow)"/>
  <rect x="955" y="91" width="10" height="10" fill="#9b7bff"/><text x="972" y="100" fill="#d6ceff" font-family="ui-monospace,Menlo,monospace" font-size="12">IAD</text>
  <rect x="1035" y="113" width="10" height="10" fill="#9b7bff"/><text x="1052" y="122" fill="#d6ceff" font-family="ui-monospace,Menlo,monospace" font-size="12">FRA</text>
  <!-- city beacon -->
  <circle cx="902" cy="214" r="22" fill="none" stroke="#ff3d9a" stroke-opacity=".55"/>
  <circle cx="902" cy="214" r="11" fill="none" stroke="#ffc857"/>
  <circle cx="902" cy="214" r="5" fill="#fff6d8" filter="url(#glow)"/>
  <path d="M770 252h104l14-14" fill="none" stroke="#ffc857" stroke-opacity=".8"/>
  <text x="640" y="248" fill="#ffc857" font-family="ui-monospace,Menlo,monospace" font-size="11" letter-spacing="2">YOU ARE HERE</text>
  <text x="640" y="268" fill="#f3f6ff" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="650">Your city, lit live</text>

  <!-- mark + type -->
  <g transform="translate(72 64) scale(1.9)" filter="url(#glow)">
    <path d="M6 2.5h15.5l8 8V29.5H2.5V6z" fill="#3dffd012" stroke="#3dffd0" stroke-width="1.6"/>
    <path d="M6.5 18.5h5l2.4-6 4.2 10 2.6-6.5h4.8" fill="none" stroke="#ff3d9a" stroke-width="2" stroke-linecap="square"/>
    <path d="M25.5 14.6l1.9 1.9-1.9 1.9-1.9-1.9z" fill="#fff"/>
  </g>
  <text x="140" y="96" fill="#3dffd0" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" letter-spacing="4">QA REPRODUCTION STUDIO</text>
  <text x="70" y="190" fill="#f3f6ff" font-family="Inter,system-ui,sans-serif" font-size="78" font-weight="700" letter-spacing="-3">Trace<tspan fill="url(#neon)">Proof</tspan></text>
  <text x="72" y="236" fill="#c3cadb" font-family="Inter,system-ui,sans-serif" font-size="22">From bug reports to reproducible evidence.</text>
  <text x="72" y="290" fill="#959fb6" font-family="ui-monospace,Menlo,monospace" font-size="13" letter-spacing="1.5">REPLAY · CHROMIUM TRACE.ZIP · PLAYWRIGHT EXPORT</text>
  <text x="72" y="318" fill="#7b859d" font-family="Inter,system-ui,sans-serif" font-size="13">Developed by: Seth Castañeda</text>
</svg>
