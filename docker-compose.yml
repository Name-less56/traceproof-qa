services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traceproof
      POSTGRES_USER: traceproof
      POSTGRES_PASSWORD: traceproof_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceproof -d traceproof"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - traceproof_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54329:5432"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://traceproof:traceproof_local_only@postgres:5432/traceproof
      HOST: 0.0.0.0
      PORT: 4391
      NODE_ENV: production
      ARTIFACT_DIR: /tmp/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4391:4391"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4391/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  traceproof_postgres:
