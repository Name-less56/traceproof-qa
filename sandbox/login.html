<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{font:14px system-ui,sans-serif;background:#f5f7fc;color:#182744;margin:0}header{background:white;padding:14px 20px;border-bottom:1px solid #dfe6f0;font-size:18px;font-weight:800}header em{font-style:normal;color:#6366f1}main{max-width:345px;margin:28px auto;background:white;padding:25px;border:1px solid #e1e5ee;border-radius:15px;box-shadow:0 20px 48px #1a2a4a0c}h1{margin:0 0 4px;font-size:20px}p{font-size:12px;color:#6a7c96}label{display:block;font-size:11px;font-weight:700;margin:16px 0 7px}input{width:100%;height:36px;border:1px solid #cad5e5;border-radius:7px;padding:8px;font:inherit}button{background:#34487b;width:100%;border:0;border-radius:7px;color:#fff;padding:11px;font-weight:700;margin-top:18px;cursor:pointer}.msg{margin-top:16px;min-height:20px;color:#0c8959;font-weight:700;font-size:12px}.hint{margin-top:13px;background:#f3f6fc;padding:10px;border-radius:7px;font-size:11px;color:#5c6981}</style></head><body><header>north<em>star</em> / customer portal</header><main><h1>Sign in</h1><p>Access your sample account.</p><label for="email">Email</label><input data-testid="login-email" id="email" type="email" autocomplete="off"><label for="pw">Password</label><input data-testid="login-password" id="pw" type="password"><button type="button" data-testid="submit-login" id="submit">Sign in</button><div data-testid="login-result" id="result" class="msg"></div><div class="hint">Demo credentials: demo@example.com / DemoPass123</div></main><script>document.getElementById('submit').addEventListener('click',()=>{const okay=document.getElementById('email').value==='demo@example.com'&&document.getElementById('pw').value==='DemoPass123';const out=document.getElementById('result');out.textContent=okay?'Welcome back, demo user!':'Incorrect email or password';out.style.color=okay?'#0c8959':'#ce4260'});</script></body></html>
